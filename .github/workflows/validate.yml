name: validate

# hermit-works リポジトリ（agents / commands / skills）の検証ワークフロー。
#
# 検証手順の正本は CONTRIBUTING.md 5章「変更後の確認手順（必須）」。ここではその手順を
# push / pull_request 時に自動実行するのみで、検証内容そのものの正本は各スクリプト側
# （scripts/validate.sh 等）にある。手順を変更する場合は CONTRIBUTING.md 側を先に更新し、
# 本ワークフローはそれに追従させること。
#
# ジョブ構成（実施内容と目的）:
#   1. claude plugin validate .        : プラグインマニフェスト（.claude-plugin/*.json）の静的検証。
#      Claude Code CLI のネイティブバイナリを devcontainer と同じ install.sh 経由で
#      その場インストールして実行する（npm パッケージ配布ではなくこの方式を選んだ理由は
#      下記コメント参照）。認証不要でオフライン動作することを確認済み（HOME を空にした
#      状態でも成功/失敗を正しく判定する）。
#   2. bash scripts/validate.sh        : frontmatter必須項目・命名規則・重複・README整合性・
#      秘密情報混入チェック等の静的検証（詳細は scripts/validate.sh 冒頭コメント）。
#   3. bash scripts/tests/run-tests.sh : 上記 validate.sh 自体の回帰テスト。
#   4. bash scripts/tests/run-git-changelog-tests.sh : scripts/git-changelog.sh の回帰テスト
#      （存在する場合のみ実行。将来的にスクリプト自体が削除された場合でもジョブを
#      失敗させず、スキップした旨のみ記録する）。
#
# 秘密情報・外部サービスへの依存: なし。使用する外部ネットワークアクセスは
# actions/checkout と Claude Code CLI インストーラ（claude.ai/install.sh）の取得のみで、
# いずれもシークレットを必要としない。

on:
  push:
    branches:
      - main
  pull_request: {}

# 同一ブランチ・同一PRでの新しいpushがあれば、実行中の古いジョブは打ち切る
# （CI時間の節約。標準的な設定であり正しさ・再現性には影響しない）。
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      # devcontainer（.devcontainer/Dockerfile）と同じ、ネイティブバイナリの
      # install.sh経由でのインストール方式を採用する。
      # - 理由1: npm経由（@anthropic-ai/claude-code）はNode.jsランタイムへの依存を
      #   追加で持ち込むが、本リポジトリの検証スクリプト群（validate.sh等）は
      #   「追加ランタイムを導入しない」方針（CONTRIBUTING.md/各スクリプトのコメント参照）
      #   を一貫して採っており、CIのセットアップ方式もこれに揃えるほうが一貫性がある。
      # - 理由2: 本リポジトリの devcontainer が既にこの方式を採用しており（動作実績あり）、
      #   ローカル開発環境とCIのインストール方式を揃えることで差異による不具合を避けられる。
      # - バージョンチャンネルは devcontainer と同じ "stable" を指定する（latestのような
      #   floating tagではないが、それでも将来のstableリリースでCLIの挙動が変わりCIが
      #   予期せず落ちるリスクはdevcontainer側と同様に許容する。再現性が必要になった場合は
      #   CLAUDE_CODE_VERSION相当のバージョン固定に切り替えること）。
      # - `claude plugin validate` はAPIキー等の認証を必要としない、ローカル完結の静的検証
      #   であることを確認済み（未認証のHOMEディレクトリでも正しく成功/失敗を判定した）。
      - name: Claude Code CLI のインストール（claude plugin validate 用）
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: claude plugin validate .
        run: claude plugin validate .

      - name: 静的検証スクリプト（scripts/validate.sh）
        run: bash scripts/validate.sh

      - name: "回帰テスト（scripts/validate.sh 用: scripts/tests/run-tests.sh）"
        run: bash scripts/tests/run-tests.sh

      - name: "回帰テスト（scripts/git-changelog.sh 用: scripts/tests/run-git-changelog-tests.sh）"
        run: |
          if [ -f scripts/tests/run-git-changelog-tests.sh ]; then
            bash scripts/tests/run-git-changelog-tests.sh
          else
            echo "scripts/tests/run-git-changelog-tests.sh が見つからないためスキップします"
          fi
